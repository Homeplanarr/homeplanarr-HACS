name: Release

# Bump "version" in manifest.json and merge: this publishes the GitHub
# release vX.Y.Z that HACS offers as an update. A version that already has a
# release is left alone, so other changes to main publish nothing.
on:
  push:
    branches: [main]
    paths:
      - custom_components/homeplanarr/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/homeplanarr/manifest.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
